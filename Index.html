<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Audiobook Studio</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body>
    <py-config>
        packages = ["re"]
    </py-config>
    <py-script src="pyscript/script_analyzer.py"></py-script>

    <header class="studio-header">
        <div class="logo">AI Audiobook Studio</div>
        <nav>
            <button class="nav-btn active">Studio</button>
            <button class="nav-btn">History</button>
            <button id="theme-toggle">🌓</button>
        </nav>
    </header>

    <main class="studio-layout">
        <!-- LEFT PANEL: Script -->
        <section class="panel editor-panel">
            <div class="panel-header">
                <h2>Script Input</h2>
                <div class="toolbar">
                    <button id="btn-load-demo" class="btn-secondary">Load Demo Script</button>
                    <button id="btn-analyze" class="btn-secondary">Analyze</button>
                </div>
            </div>
            <textarea id="script-editor" placeholder="Paste or type your manuscript here..."></textarea>
            <div class="analytics-bar">
                <span id="stat-words">Words: 0</span> | 
                <span id="stat-chars">Characters: 0</span> | 
                <span id="stat-chapters">Chapters: 0</span> |
                <span id="stat-duration">Est. Duration: 0m</span>
            </div>
        </section>

        <!-- RIGHT PANEL: Settings -->
        <aside class="panel settings-panel">
            <div class="settings-section">
                <h3>1. Provider & Voice</h3>
                <label>Provider</label>
                <select id="sel-provider">
                    <option value="elevenlabs">ElevenLabs</option>
                    <option value="openai">OpenAI</option>
                </select>
                
                <label>Model</label>
                <select id="sel-model">
                    <option value="eleven_multilingual_v2">Multilingual v2 (Long-form)</option>
                    <option value="eleven_v3">English v3 (Expressive)</option>
                </select>

                <label>Voice</label>
                <select id="sel-voice">
                    <option value="">Loading voices...</option>
                </select>
            </div>

            <div class="settings-section">
                <h3>2. Voice Controls</h3>
                <label>Stability: <span id="val-stability">50</span>%</label>
                <input type="range" id="sl-stability" min="0" max="100" value="50">
                
                <label>Similarity: <span id="val-similarity">75</span>%</label>
                <input type="range" id="sl-similarity" min="0" max="100" value="75">
            </div>

            <div class="settings-section">
                <h3>3. Audiobook Metadata</h3>
                <input type="text" id="meta-title" placeholder="Book Title">
                <input type="text" id="meta-author" value="Angu" placeholder="Author">
            </div>

            <div class="action-section">
                <button id="btn-generate" class="btn-primary">Generate Audiobook</button>
            </div>
            
            <div id="queue-manager" class="hidden">
                <h3>Generation Progress</h3>
                <div id="progress-bar-container"><div id="progress-bar"></div></div>
                <p id="status-text">Queued...</p>
            </div>
        </aside>
    </main>

    <!-- PLAYER COMPONENT -->
    <footer class="player-bar hidden" id="audio-player">
        <div class="player-controls">
            <button id="btn-play">▶ Play</button>
            <button id="btn-pause" class="hidden">⏸ Pause</button>
            <input type="range" id="seek-bar" value="0" min="0" max="100">
            <span id="time-display">00:00 / 00:00</span>
        </div>
        <div class="player-actions">
            <button id="btn-download-zip" class="btn-secondary">Download Package</button>
        </div>
    </footer>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/player.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
